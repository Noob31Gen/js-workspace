name: Immutable Tag & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Enforce least-privilege permissions across the workflow
permissions:
  contents: write
  id-token: write
  attestations: write

# Prevent duplicate concurrent runs on the same tag
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Build, Lint & Test Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js Runtime (LTS 22.x)
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Verify Frozen Lockfile & Install Dependencies
        run: |
          npm ci --prefer-offline --no-audit

      - name: Run Linter
        run: |
          npm run lint

      - name: Run Test Suites
        run: |
          npm test

      - name: Build Production Assets
        run: |
          npm run build

      - name: Package Deterministic Release Archives
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DIST_ZIP="js-workspace-${VERSION}-dist.zip"
          DIST_TARGZ="js-workspace-${VERSION}-dist.tar.gz"

          # Create zip & tar.gz archives of production dist folder
          (cd dist && zip -r "../${DIST_ZIP}" .)
          tar -czf "${DIST_TARGZ}" -C dist .

          # Generate Cryptographic SHA-256 Checksum Manifest
          sha256sum "${DIST_ZIP}" "${DIST_TARGZ}" > SHA256SUMS

          echo "Generated Checksums for ${VERSION}:"
          cat SHA256SUMS

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            js-workspace-*-dist.zip
            js-workspace-*-dist.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: GitHub Release Publishing
    needs: validate-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: ./release-files

      - name: Verify Artifact Checksums
        run: |
          cd ./release-files
          sha256sum --check SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"

          {
            echo '```'
            cat ./release-files/SHA256SUMS
            echo '```'
          } > release_notes.md

          # Create or update GitHub Release with assets & checksums
          gh release create "${VERSION}" \
            ./release-files/js-workspace-*-dist.zip \
            ./release-files/js-workspace-*-dist.tar.gz \
            ./release-files/SHA256SUMS \
            --title "Release ${VERSION}" \
            --notes-file release_notes.md \
            --generate-notes || gh release upload "${VERSION}" ./release-files/* --clobber
