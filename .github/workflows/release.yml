name: Immutable Build & Release Sequence

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version tag to release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      draft:
        description: 'Create as draft release'
        type: boolean
        default: false

# Enforce least-privilege permissions across the workflow
permissions:
  contents: write
  id-token: write
  attestations: write

# Prevent concurrent mutable runs on the same ref
concurrency:
  group: release-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Deterministic Build & Validation
    runs-on: ubuntu-latest
    steps:
      # Pinned commit SHA for actions/checkout (v4.2.2)
      - name: Checkout Source Code (Immutable Commit)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      # Pinned commit SHA for actions/setup-node (v4.2.0)
      - name: Setup Node.js Runtime (LTS 20.x)
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Verify Frozen Lockfile & Install Dependencies
        run: |
          npm ci --prefer-offline --no-audit

      - name: Execute Full Automated Test Matrix
        run: |
          npm test

      - name: Compile Production Artifacts
        run: |
          npm run build

      - name: Package Deterministic Release Archives
        id: package
        run: |
          VERSION="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.release_tag }}"
          fi

          DIST_ZIP="js-workspace-${VERSION}-dist.zip"
          DIST_TARGZ="js-workspace-${VERSION}-dist.tar.gz"

          # Create zip & tar.gz archives of production dist folder
          (cd dist && zip -r "../${DIST_ZIP}" .)
          tar -czf "${DIST_TARGZ}" -C dist .

          # Generate Cryptographic SHA-256 Checksum Manifest
          sha256sum "${DIST_ZIP}" "${DIST_TARGZ}" > SHA256SUMS

          echo "Generated Checksums:"
          cat SHA256SUMS

          echo "dist_zip=${DIST_ZIP}" >> "$GITHUB_OUTPUT"
          echo "dist_targz=${DIST_TARGZ}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Pinned commit SHA for actions/upload-artifact (v4.6.1)
      - name: Upload Immutable Build Outputs
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-assets
          path: |
            js-workspace-*-dist.zip
            js-workspace-*-dist.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  attest-and-publish:
    name: Cryptographic Attestation & Release
    needs: validate-and-build
    runs-on: ubuntu-latest
    steps:
      # Pinned commit SHA for actions/checkout (v4.2.2)
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Pinned commit SHA for actions/download-artifact (v4.1.9)
      - name: Download Build Assets
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.9
        with:
          name: release-assets
          path: ./release-files

      - name: Verify Artifact Checksums
        run: |
          cd ./release-files
          sha256sum --check SHA256SUMS

      # Generate Cryptographic SLSA Build Provenance (GitHub Official Attestation)
      # Pinned commit SHA for actions/attest-build-provenance (v2.2.3)
      - name: Generate Cryptographic SLSA Build Attestations
        uses: actions/attest-build-provenance@c074443f1a5fb4aee83904b7124fa0a5148a44d1 # v2.2.3
        with:
          subject-path: |
            ./release-files/js-workspace-*-dist.zip
            ./release-files/js-workspace-*-dist.tar.gz

      - name: Publish Immutable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          DRAFT_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.release_tag }}"
            if [ "${{ github.event.inputs.draft }}" = "true" ]; then
              DRAFT_FLAG="--draft"
            fi
          fi

          RELEASE_NOTES="### 🚀 JS-Workspace Production Release \`${VERSION}\`

#### 🔒 Cryptographic Immutability & Provenance:
- **Build Provenance**: Cryptographically attested via Sigstore & GitHub SLSA Level 3
- **Action Pinning**: Pinned 40-character commit SHAs across all workflow steps
- **Validation**: 100% automated test suite verified before release

#### 📦 Release Assets & Checksums:
\`\`\`
$(cat ./release-files/SHA256SUMS)
\`\`\`
"

          # Create or update GitHub Release with pinned assets & checksums
          gh release create "${VERSION}" \
            ./release-files/js-workspace-*-dist.zip \
            ./release-files/js-workspace-*-dist.tar.gz \
            ./release-files/SHA256SUMS \
            --title "Release ${VERSION}" \
            --notes "${RELEASE_NOTES}" \
            ${DRAFT_FLAG} \
            --generate-notes || gh release upload "${VERSION}" ./release-files/* --clobber
