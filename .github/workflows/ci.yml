name: Continuous Integration & Verification

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  ci-test-and-build:
    name: Build, Lint & Test Verification
    runs-on: ubuntu-latest
    steps:
      # Pinned commit SHA for actions/checkout (v4.2.2)
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Pinned commit SHA for actions/setup-node (v4.2.0)
      - name: Setup Node.js Runtime (LTS 20.x)
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Verify Frozen Dependencies
        run: |
          npm ci --prefer-offline --no-audit

      - name: Run Test Suites
        run: |
          npm test

      - name: Verify Production Build
        run: |
          npm run build
